<script>
const L="ABCD";
// [enunciado, [A,B,C,D], índice correto, explicação]
const Q=[
["Jorge tem uma imobiliária tradicional que sobreviveu a crises e virou sinônimo de bons negócios, mesmo com a concorrência desleal. É válido afirmar que a ética:",
["baseia-se em valores ligados ao bom funcionamento da empresa e no respeito aos direitos dos funcionários, fornecedores, clientes e da sociedade.","estabelece metas audaciosas com base nos resultados dos concorrentes para aumentar a participação de mercado.","determina que a organização seja sustentável a qualquer custo, priorizando marketing e divulgando balanços ilegítimos.","tem a ver com evasão fiscal e formas de estudar a lei para pagar menos impostos."],0,"Ética é um conjunto de valores que orienta a conduta da empresa e o respeito a todos os públicos com quem ela se relaciona. Balanços ilegítimos e evasão fiscal são o oposto disso, e metas de mercado não definem ética."],
["João, técnico em Transações Imobiliárias, quer usar Inteligência Artificial para atender melhor clientes fora do horário comercial, sem perder qualidade no relacionamento. A IA no mercado imobiliário:",
["assume as atividades do corretor no atendimento e na validação da negociação.","concentra-se na automação de cálculos financeiros, com uso secundário na comunicação.","auxilia na automatização de tarefas repetitivas e na organização de dados, permitindo ao corretor focar em atividades estratégicas.","baseia-se em respostas padronizadas e fluxos fixos que substituem a adaptação às necessidades do cliente."],2,"A IA é apoio: automatiza o repetitivo e organiza dados, liberando o corretor para o que exige julgamento humano. Ela não substitui o corretor nem se limita a cálculos ou respostas fixas."],
["Sobre as diretrizes da empresa:\n1. Os objetivos estratégicos devem ser estabelecidos com foco na missão, visão e valores.\n2. A determinação da visão de futuro afirma o propósito para o qual a organização foi concebida.\n3. O estabelecimento dos valores corporativos fortalece a cultura organizacional.",
["1, somente.","2 e 3, somente.","1 e 3, somente.","1, 2 e 3."],2,"A afirmativa 2 está errada: o propósito para o qual a organização foi criada é a MISSÃO. A visão descreve onde a empresa quer chegar no futuro. As afirmativas 1 e 3 estão corretas."],
["Carlos, corretor, estruturou um fluxo de trabalho (captação, atendimento, visitas, negociação, fechamento) com procedimentos detalhados para cada atividade do dia a dia. Ele executou o planejamento:",
["tático.","funcional.","estratégico.","operacional."],3,"O planejamento operacional trata da execução das atividades cotidianas, com procedimentos detalhados. O estratégico define rumos de longo prazo e o tático trabalha por áreas, em médio prazo."],
["Ricardo registra clientes atendidos, visitas, propostas e vendas para entender por que converte poucos atendimentos. Os indicadores de desempenho:",
["são registros administrativos para controle externo, focados na organização documental.","permitem acompanhar resultados e analisar o desempenho, auxiliando na identificação de melhorias e na tomada de decisões estratégicas.","são informações descritivas dos imóveis usadas na apresentação aos clientes.","são relatórios administrativo-financeiros usados para calcular comissões."],1,"Indicadores medem resultados (como a taxa de conversão de visitas em vendas) e apoiam decisões de melhoria. Não são só documentação, descrição de imóveis ou cálculo de comissão."],
["Marcos, engenheiro civil, reduz desperdícios e descarta resíduos corretamente em suas obras. Segundo a ONU, desenvolvimento sustentável é:",
["o crescimento resultante da parceria entre organizações públicas e privadas, em prol do capitalismo consciente.","a estratégia de empresas que focam em produtos baratos e de alto giro.","aquele que atende às necessidades do presente sem comprometer os anseios das futuras gerações.","o lucro destinado à sociedade, gerado por empresas recém-fundadas."],2,"É o conceito clássico do Relatório Brundtland (ONU): atender ao presente sem comprometer a capacidade das gerações futuras de atender às suas próprias necessidades."],
["Renan concluiu o curso técnico, percebeu a necessidade de qualificação contínua e buscou um mentor para orientar decisões e identificar oportunidades. Renan:",
["demonstra comportamento empreendedor ao investir em seu desenvolvimento, aperfeiçoando decisões e ampliando sua atuação.","orienta-se por decisões negligentes, lidando com desafios e certezas.","organiza a prática por resultados de curto prazo, priorizando retorno financeiro imediato.","direciona a atuação para práticas individuais, distanciado do mercado."],0,"Buscar qualificação, mentoria e oportunidades é típico do comportamento empreendedor. As outras alternativas descrevem atitudes que contradizem o que Renan fez."],
["Nivaldo, gestor de imobiliária, aprendeu em um curso do SEBRAE que uma boa ideia não é necessariamente uma oportunidade de negócio. Negócio:",
["é uma ferramenta para monitorar o mercado e criar novos produtos.","é uma normatização de políticas públicas que desburocratizam a formalização de empresas.","tem como objetivo principal propagar a informalidade.","é uma atividade organizada que visa oferecer produto ou serviço para atender a um público específico."],3,"Um negócio é uma atividade organizada voltada a um público definido, e é isso que o diferencia de uma simples ideia."],
["Samuel contratou uma empresa para mapear riscos e gerir saúde e segurança do trabalho, e viu menos acidentes e custos. O principal objetivo da gestão de saúde e segurança do trabalho:",
["resume-se a investir na qualidade de vida para obter lucros e benefícios fiscais.","concentra-se em metas empresariais de cunho financeiro.","é resguardar a vida e a integridade física de quem trabalha, em uma abordagem em que todos ganham.","é estruturar canais de vendas para lucrar com o trabalhador saudável e disponível."],2,"O objetivo principal é proteger a vida e a integridade do trabalhador. Redução de custos e de afastamentos é consequência, o que faz todos ganharem."],
["Lucas afirmou a um cliente que todos os galpões ofertados atendem à NR 23 (proteção contra incêndios):\n1. Extintores acessíveis, sinalizados e dentro da validade.\n2. Rotas de fuga sinalizadas, iluminadas e desobstruídas.\n3. Instalações elétricas bem conservadas, reduzindo riscos de curto-circuito e incêndio.",
["1, somente.","2, somente.","2 e 3, somente.","1, 2 e 3."],3,"Todas as condições se relacionam à prevenção e combate a incêndios: extintores, rotas de fuga e redução de focos de incêndio nas instalações elétricas."],
["Sobre riscos ocupacionais:\n1. Ergonomia é a ciência que busca adaptar o trabalho ao ser humano, e não o contrário.\n2. Segurança no trabalho se concentra em proteger contra riscos biológicos e físicos.\n3. Postos de trabalho devem ser planejados para oferecer conforto, segurança e eficiência.",
["1, 2 e 3.","1 e 3, somente.","1 e 2, somente.","3, somente."],1,"A afirmativa 2 está errada: a segurança do trabalho não se limita a riscos biológicos e físicos, pois abrange também riscos químicos, ergonômicos e de acidentes. As afirmativas 1 e 3 estão corretas."],
["Uma imobiliária com documentos difíceis de localizar e procedimentos desiguais implantou o Programa 5S. Quais princípios estruturam essa metodologia?",
["Promover o uso consciente dos materiais, estruturar os espaços de trabalho, sistematizar as atividades e cultivar hábitos permanentes de conservação e aperfeiçoamento.","Descentralizar decisões operacionais, estimular a autonomia e integrar departamentos.","Ampliar a capacidade de atendimento, estabelecer metas individuais e fortalecer resultados comerciais.","Investir em modernização tecnológica, automatizar tarefas e intensificar o monitoramento financeiro."],0,"Os 5S (utilização, organização, limpeza, padronização e disciplina) tratam de uso consciente, arrumação, sistematização e hábitos permanentes. As demais alternativas falam de gestão, vendas e tecnologia, que não são 5S."],
["Diante do aumento de reclamações de clientes, uma imobiliária usou ferramentas da qualidade. Sobre o Diagrama de Ishikawa:",
["permite registrar resultados, comparar indicadores e acompanhar a evolução dos processos.","possibilita relacionar diferentes fatores associados a uma ocorrência, estruturando sua análise e contribuindo para medidas de melhoria.","orienta a execução das atividades estabelecidas, distribuindo responsabilidades.","integra as etapas de planejamento e implementação das mudanças em uma sequência de melhoria."],1,"O Diagrama de Ishikawa (causa e efeito, ou espinha de peixe) organiza as possíveis causas de um problema para que se possam definir melhorias. As outras alternativas descrevem indicadores, plano de ação (5W2H) e o ciclo PDCA."],
["Uma imobiliária implantou um SGQ baseado na ISO 9001, documentando procedimentos, acompanhando indicadores e incentivando sugestões dos colaboradores. Assinale a correta:",
["O SGQ concentra a execução em profissionais mais experientes, priorizando decisões individuais.","A melhoria é conduzida por intervenções definidas pela liderança, com avaliação só após a implementação.","O SGQ promove a padronização dos processos, a tomada de decisões com base em dados e o envolvimento contínuo dos colaboradores na melhoria das atividades.","As normas de qualidade orientam usar o aumento dos custos operacionais como referência de desempenho."],2,"A ISO 9001 se apoia em padronização, decisões baseadas em evidências (dados) e envolvimento das pessoas, com melhoria contínua. Decisões individuais ou centralizadas só pela liderança contrariam esses princípios."],
["Ao elaborar um PTAM, o corretor teve acesso a dados pessoais e financeiros do cliente e considerou a LGPD. Assinale a correta:",
["O tratamento de dados pode ocorrer conforme a conveniência do profissional, se agilizar o atendimento.","O uso de dados pessoais deve estar vinculado a uma finalidade específica, com coleta adequada, proteção das informações e clareza sobre sua utilização.","Incluir declaração de confidencialidade no PTAM mostra que o parecer diverge da LGPD.","O compartilhamento de informações entre profissionais é permitido como prática comum de mercado."],1,"A LGPD exige finalidade, adequação, necessidade, segurança e transparência. Conveniência do profissional e compartilhamento por prática de mercado não são bases legais, e a declaração de confidencialidade reforça a LGPD, não a contraria."],
["Na parte inicial de um PTAM, João organizou a identificação do solicitante, a finalidade do documento e outros requisitos normativos. Assinale a correta:",
["A finalidade pode ser vaga, desde que haja os dados básicos do imóvel.","A numeração do parecer segue um padrão único definido por órgãos reguladores, com uniformidade nacional.","A indicação das normas técnicas é complementar e pode ser adaptada à preferência do profissional.","A organização dos elementos iniciais do PTAM contribui para identificar as partes, o objetivo e a conformidade de parâmetros técnicos e legais."],3,"Os elementos iniciais (solicitante, finalidade, normas) identificam as partes e o objetivo e demonstram conformidade técnica e legal. A finalidade deve ser clara, a numeração não tem padrão nacional único e as normas não são opcionais."],
["Marcos elaborou o PTAM de um apartamento em região em expansão e o cliente perguntou como o valor foi estimado. Assinale a correta:",
["A descrição do imóvel e da região é ilustrativa, e o valor final se baseia em pressupostos do profissional.","Mapas e imagens aéreas comprometem a visualização do entorno e são só complementares.","A análise das confrontações tem impacto ínfimo na interpretação do valor de mercado.","As características do imóvel, do seu entorno e dados comparativos de mercado são usados para aferir o valor nas avaliações imobiliárias."],3,"O valor é fundamentado tecnicamente em características do imóvel, entorno e dados comparativos de mercado, e não em pressupostos pessoais. A descrição do imóvel e da região não é meramente ilustrativa."],
["O gerente Darci discute a importância da documentação na avaliação de propriedades. Qual é o propósito fundamental dessa regulamentação (norma técnica)?",
["estabelecer critérios técnicos que orientem as avaliações imobiliárias.","orientar como realizar inspeções e avaliações em imóveis comerciais.","definir os direitos dos proprietários em disputas legais sobre avaliações.","estabelecer critérios uniformes para garantir precisão nas avaliações imobiliárias."],3,"Segundo o gabarito oficial, o propósito fundamental é uniformizar critérios para garantir precisão nas avaliações. A alternativa A é parecida, mas não traz a ideia de uniformidade e precisão, que é o ponto central. As demais restringem o escopo (imóveis comerciais) ou tratam de direitos em disputas legais."],
["A corretora Júlia foi dispensada pela construtora antes da conclusão do projeto, mas o negócio foi fechado semanas depois. De acordo com o art. 727 do Código Civil:",
["Júlia perde a comissão, pois o contrato foi rescindido antes da conclusão.","se o negócio for realizado como fruto da mediação de Júlia, a corretagem lhe será devida.","Júlia só tem direito à comissão se houver novo contrato após a dispensa.","Júlia deve esperar um prazo de carência antes de reivindicar a comissão."],1,"O art. 727 do Código Civil prevê que, se o negócio se realizar posteriormente, mas como resultado da mediação do corretor, a corretagem é devida, mesmo que ele tenha sido dispensado."],
["João foi contratado por um incorporador para avaliar um imóvel para um novo projeto. Qual alternativa traz o método e sua característica correta?",
["o método evolutivo é aplicável à comparação de imóveis semelhantes.","o método da capitalização da renda ignora o potencial de geração de receita do imóvel.","o método involutivo é utilizado para determinar o valor de imóveis em empreendimento hipotético.","o método comparativo direto é restrito a imóveis de alto padrão."],2,"O método involutivo avalia o terreno com base em um empreendimento hipotético viável. Comparar imóveis semelhantes é o método comparativo direto, a capitalização da renda justamente considera a receita e o comparativo direto não é restrito a alto padrão."],
["A construtora Edifícios Modernos foi contratada pela incorporadora Crescer Imóveis. Qual é o papel específico da construtora na incorporação?",
["gerenciar as vendas das unidades, definindo marketing e preços.","executar a obra e garantir que o projeto seja realizado conforme o planejado, seguindo prazos e padrões de qualidade.","obter as licenças necessárias para a construção.","definir os preços das unidades antes do início da construção."],1,"A construtora executa a obra. Vendas, licenças e preços são funções da incorporadora, que coordena o empreendimento."],
["A incorporadora Excelência Imobiliária optou pelo Regime Especial de Tributação (RET). Conforme a Lei nº 10.931/2004, a vantagem para ela é:",
["reduzir sem restrições a carga fiscal.","o pagamento mensal unificado de tributos calculado sobre a receita mensal recebida pela incorporação.","a isenção total de impostos durante a construção.","o aumento da carga tributária sobre as receitas do empreendimento."],1,"No RET, os tributos são unificados e pagos mensalmente por alíquota sobre a receita mensal recebida. Não há isenção total nem redução sem restrições."],
["Roberto, corretor inscrito no CNAI, elabora PTAM e foi indicado como perito em um processo judicial de valoração de imóvel. Assinale a correta:",
["O parecer tem caráter opinativo e pode se basear em percepções pessoais sobre o mercado.","O corretor pode elaborar PTAM com base em critérios técnicos, e o parecer pode ser apresentado como elemento de prova em processo judicial.","O perito judicial dispensa métodos reconhecidos, desde que o valor seja coerente com o mercado local.","O laudo pericial deve priorizar a interpretação subjetiva do perito."],1,"O PTAM exige critérios técnicos e métodos reconhecidos, e pode servir como elemento de prova. Percepções pessoais e subjetividade não sustentam um parecer ou laudo."],
["A Incorporadora Matrix desenvolve um projeto em município com Plano Diretor. Para estar em conformidade com a Constituição e a legislação urbanística, o planejamento deve considerar:",
["definir áreas exclusivas para grandes indústrias, ignorando a habitação.","limitar plenamente o uso de áreas verdes para o desenvolvimento econômico.","prever mecanismos de participação da comunidade nas decisões sobre o uso do solo.","simplificar normas urbanísticas para acelerar a aprovação de projetos habitacionais."],2,"A gestão democrática da cidade (Estatuto da Cidade) exige participação da população no planejamento urbano. As outras alternativas contrariam a função social da cidade."],
["A Incorporadora Espaço Ideal avalia um projeto sujeito a Código de Obras específico. Que desafios a diversidade de Códigos de Obras entre municípios impõe às incorporadoras?",
["Favorece grandes incorporadoras, que podem ignorar requisitos locais.","As variações são irrelevantes, pois os municípios seguem diretrizes federais uniformes.","Cria um ambiente em que as pequenas incorporadoras têm vantagem por operar com menos regulamentação.","As diferenças nas normas locais podem elevar os custos de adaptação dos projetos e prolongar licenças e aprovações, impactando a viabilidade econômica."],3,"Cada município tem seu Código de Obras. Isso exige adaptações de projeto, encarece e atrasa aprovações, o que afeta a viabilidade do empreendimento, independentemente do porte da incorporadora."],
["Ao atender um cliente que quer locar uma unidade em condomínio, o corretor deve considerar o acesso e as condições contratuais. Assinale a correta:",
["o acesso do corretor é livre, bastando identificação verbal na portaria.","o ingresso no condomínio pode exigir cadastro prévio, identificação formal e registro de entrada, conforme regras da administração.","as condições contratuais seguem padrão único e independem de despesas adicionais ou uso de áreas comuns.","a negociação isenta a definição de responsabilidades sobre encargos."],1,"Condomínios têm regras próprias de acesso (cadastro, identificação, registro). Além disso, a locação envolve encargos e uso de áreas comuns que devem ter as responsabilidades definidas em contrato."],
["Mariana vai vender uma casa cujo dono dá a ela valor acima da média por causa de memórias afetivas. Após a vistoria surgiram divergências de preço. Assinale a correta:",
["A vistoria se concentra na análise interna, e os aspectos externos ficam para etapas posteriores.","A depreciação está vinculada ao tempo de construção e raramente é influenciada por uso ou condições ambientais.","O valor de mercado pode ser definido pela percepção do proprietário, considerando o vínculo afetivo.","A definição do valor envolve a análise das características do imóvel, do seu estado de conservação, da vida útil e de fatores externos."],3,"O valor de mercado é técnico e não depende do valor afetivo. Ele considera características, conservação, vida útil e fatores externos. A vistoria inclui aspectos externos e a depreciação também depende de uso e condições ambientais."],
["Carlos explica a um cliente o usufruto, um direito real, e suas nuances para o usufrutuário. Assinale a correta:",
["o usufruto permite ao usufrutuário realizar obras de melhoria de forma irrestrita.","o usufruto é temporário e se extingue automaticamente após cinco anos.","o usufrutuário tem o direito de posse e uso do imóvel, mas é impedido de vender ou transferir a propriedade.","o usufrutuário pode vender o imóvel, desde que notifique o proprietário por escrito."],2,"O usufrutuário usa e frui do bem (posse, uso e frutos), mas a propriedade pertence ao nudo-proprietário, então ele não pode vender o imóvel. O usufruto não tem prazo fixo de cinco anos e obras dependem de limites legais."],
["A Imobiliária Sol Nascente orienta clientes sobre o CDC em contratos de compra e venda de imóveis. Assinale a correta:",
["O consumidor pode exigir informações detalhadas sobre o imóvel, incluindo problemas conhecidos que possam influenciar sua decisão, cabendo à imobiliária comunicá-los de forma acessível.","O CDC permite cláusulas que limitem a responsabilidade por vícios ocultos, se destacadas no contrato.","O prazo para reclamar de vícios ocultos é de três anos após a entrega das chaves, e o CDC não prevê prazos diferenciados para imóveis.","A responsabilidade da imobiliária por vícios ocultos é limitada ao valor do contrato, excluindo danos morais ou materiais adicionais."],0,"O CDC garante o direito à informação clara e adequada. Cláusulas que exoneram ou limitam a responsabilidade por vícios são nulas e a reparação de danos deve ser integral, incluindo danos morais e materiais."],
["Ricardo, avaliador com CNAI, usou o Método Comparativo Direto de Dados de Mercado conforme a ABNT NBR 14.653-1. Assinale a correta:",
["a avaliação é aplicável exclusivamente a imóveis residenciais.","o avaliador deve usar a média aritmética dos preços dos comparáveis, sem considerar outras variáveis.","a análise das características dos imóveis comparáveis inclui elementos como localização, tamanho e estado de conservação, permitindo ajustes nos valores para refletir as diferenças.","o método isenta a coleta de dados sobre imóveis semelhantes, pois o avaliador se baseia em sua experiência."],2,"O método compara o imóvel avaliado com amostras de mercado e usa ajustes ou tratamento dos dados para compensar diferenças de localização, tamanho, conservação etc. Exige coleta de dados e vale para vários tipos de imóveis."]
];
const app=document.getElementById("app");
let i=0,score=0,picks=[],answered=false;
const card="bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-xl";
const btnP="w-full sm:w-auto px-6 py-3 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white font-semibold focus:outline-none focus:ring-4 focus:ring-indigo-300";
const esc=s=>s.replace(/&/g,"&amp;").replace(/</g,"&lt;");

function start(){i=0;score=0;picks=[];answered=false;
app.innerHTML=`<div class="${card} p-6 sm:p-8 mt-6">
<h1 class="text-2xl sm:text-3xl font-bold">Simulado do exame presencial</h1>
<p class="mt-1 text-slate-600 dark:text-slate-300">Transações Imobiliárias – Módulo 2</p>
<p class="mt-4 text-slate-600 dark:text-slate-300">${Q.length} questões de múltipla escolha. Ao errar, você vê por que a alternativa correta é a certa. No fim, aparece sua nota.</p>
<button id="go" class="${btnP} mt-6">Começar simulado</button></div>`;
document.getElementById("go").onclick=show;}

function show(){answered=false;const [q,o]=Q[i];
const pct=Math.round(i/Q.length*100);
app.innerHTML=`<div class="flex items-center justify-between text-sm text-slate-600 dark:text-slate-300 mb-2"><span>Questão ${i+1} de ${Q.length}</span><span>Acertos: ${score}</span></div>
<div class="h-2 rounded-full bg-slate-200 dark:bg-slate-700 mb-5"><div class="h-2 rounded-full bg-indigo-600" style="width:${pct}%"></div></div>
<div class="${card} p-5 sm:p-6"><p class="whitespace-pre-line leading-relaxed font-medium">${esc(q)}</p>
<div class="mt-5 space-y-3" id="opts">${o.map((t,k)=>`<button data-k="${k}" class="opt w-full text-left flex gap-3 p-3 rounded-lg border border-slate-300 dark:border-slate-600 hover:border-indigo-500 hover:bg-indigo-50 dark:hover:bg-slate-700 focus:outline-none focus:ring-2 focus:ring-indigo-500"><span class="font-bold shrink-0 w-6">${L[k]})</span><span>${esc(t)}</span></button>`).join("")}</div>
<div id="fb" class="mt-5"></div></div>`;
document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>answer(+b.dataset.k));}

function answer(k){if(answered)return;answered=true;
const [,o,c,e]=Q[i];picks[i]=k;const ok=k===c;if(ok)score++;
document.querySelectorAll(".opt").forEach(b=>{const n=+b.dataset.k;b.disabled=true;b.className="opt w-full text-left flex gap-3 p-3 rounded-lg border-2 "+
(n===c?"border-emerald-500 bg-emerald-50 dark:bg-emerald-950 ":n===k?"border-rose-500 bg-rose-50 dark:bg-rose-950 ":"border-slate-200 dark:border-slate-700 opacity-60 ");});
const last=i===Q.length-1;
document.getElementById("fb").innerHTML=(ok?`<p class="p-3 rounded-lg bg-emerald-100 dark:bg-emerald-900 text-emerald-900 dark:text-emerald-100 font-semibold">Correto!</p>`
:`<div class="p-4 rounded-lg bg-rose-100 dark:bg-rose-900 text-rose-950 dark:text-rose-50"><p class="font-semibold">Incorreto. A resposta correta é a ${L[c]}.</p><p class="mt-2 text-sm leading-relaxed">${esc(e)}</p></div>`)+
`<button id="nx" class="${btnP} mt-4">${last?"Ver nota final":"Próxima questão"}</button>`;
document.getElementById("nx").onclick=()=>{if(last)result();else{i++;show();}};
document.getElementById("nx").focus();}

function result(){const n=(score/Q.length*10).toFixed(1).replace(".",","),p=Math.round(score/Q.length*100);
const wrong=Q.map((x,k)=>k).filter(k=>picks[k]!==Q[k][2]);
const msg=p>=70?"Ótimo desempenho!":p>=50?"Bom caminho. Revise os erros abaixo.":"Vale estudar mais e tentar de novo.";
app.innerHTML=`<div class="${card} p-6 sm:p-8 mt-4 text-center">
<p class="text-slate-600 dark:text-slate-300">Nota final</p>
<p class="text-6xl font-bold text-indigo-600 dark:text-indigo-400 mt-1">${n}</p>
<p class="mt-2 font-semibold">${score} de ${Q.length} acertos (${p}%)</p>
<p class="mt-1 text-slate-600 dark:text-slate-300">${msg}</p>
<button id="rs" class="${btnP} mt-5">Refazer simulado</button></div>
${wrong.length?`<h2 class="text-lg font-bold mt-8 mb-3">Questões para revisar (${wrong.length})</h2><div class="space-y-3">${wrong.map(k=>`<details class="${card} p-4"><summary class="cursor-pointer font-medium">Questão ${k+1}: você marcou ${L[picks[k]]}, a correta é ${L[Q[k][2]]}</summary>
<p class="mt-3 text-sm whitespace-pre-line">${esc(Q[k][0])}</p>
<p class="mt-2 text-sm font-semibold text-emerald-700 dark:text-emerald-400">${L[Q[k][2]]}) ${esc(Q[k][1][Q[k][2]])}</p>
<p class="mt-2 text-sm text-slate-600 dark:text-slate-300">${esc(Q[k][3])}</p></details>`).join("")}</div>`:`<p class="mt-6 text-center font-semibold">Você acertou todas as questões!</p>`}`;
document.getElementById("rs").onclick=start;window.scrollTo(0,0);}
start();
</script>
</body>
</html>
